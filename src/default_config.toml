# seance configuration
# Place this file at ~/.config/seance/config.toml

[font]
# family = "Monospace"
# size = 13.0

[colors]
# theme = ""                     # ghostty theme name — overrides ghostty's own theme setting
                                 # when empty (default), ghostty's resolved theme is used
# background-opacity = 1.0

[window]
# width = 1200
# height = 800
# decoration-mode = "auto"         # "auto" (GNOME=CSD, else=SSD), "csd", or "ssd"

[sidebar]
# position = "left"              # "left" or "right"
# width = 200
# visible = true
# show-button-bar = true         # bottom button row with server-side window decorations
# show-notification-text = true  # latest notification text below workspace title
# show-status = true             # custom status metadata pills
# show-logs = true               # most recent log message
# show-progress = true           # active progress indicator
# show-branch = true             # git branch and working directory
# show-ports = true              # detected listening ports

[terminal]
# scrollback-lines = 10000
# cursor-shape = "block"         # "block", "ibeam", "underline"
# cursor-blink = true

[behavior]
# bell-notification = true
# desktop-notifications = true
# focus-follows-mouse = false
# confirm-close-window = true
# opencode-hooks = true          # track local OpenCode sessions (new panes)
# antigravity-hooks = true       # track Antigravity CLI sessions (new panes)
# zmx-attach = false             # every terminal pane execs `zmx attach
                                 # seance-<pane-uuid>` — persistent sessions
                                 # per terminal that survive seance restarts.
                                 # On every EXPLICIT close (pane/tab/window
                                 # while others remain) seance runs
                                 # `zmx kill --force seance-<uuid>` for the
                                 # terminals going away; whole-app quit keeps
                                 # sessions alive for the next re-attach.

[hooks]
# on-tab-open = ""               # shell command on explicit tab creation
# on-tab-close = ""              # shell command on explicit tab close
                                 # (not on window quit or app exit; the zmx
                                 # kill above is built-in, this is for extras);
                                 # env: SEANCE_HOOK, SEANCE_TAB_UUID,
                                 # SEANCE_WORKSPACE_ID, SEANCE_TAB_TITLE,
                                 # SEANCE_PANE_UUIDS (close only)

[notifications]
# sound = "default"              # "default", "none", or path to .wav/.ogg file

[keybinds]
# command_palette = "ctrl+shift+p"
# open_folder = "ctrl+shift+o"
# reload_config = "ctrl+shift+comma"

[socket]
# path = ""
